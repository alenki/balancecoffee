<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/bloom-mark-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="بلوم روستري: محمصة ومقهى قهوة مختصة في المدينة المنورة. ثلاثة فروع، تحميص على لورينغ S15 فالكون، وقريبًا في جدة." />
    <title>بلوم روستري | Bloom Roastery</title>

    <!-- Link previews (WhatsApp, Telegram, iMessage, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bloom Roastery" />
    <meta property="og:title" content="بلوم روستري | Bloom Roastery" />
    <meta property="og:description" content="قهوة مختصة وُلدت في المدينة المنورة. Specialty coffee roastery born in Madinah." />
    <meta property="og:url" content="https://lumako.net/bloomroastery/" />
    <!-- A fixed rung, not a srcset: link unfurlers fetch one plain URL, and it
         has to be absolute, because they do not resolve a site relative path.
         Vite does not rewrite meta content, so this carries the host in full. -->
    <meta property="og:image" content="https://lumako.net/bloomroastery/img/brand/cover-1280.webp" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="505" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Outfit: Latin display, UI and body, the geometric sans Bloom sets all
      of its own material in. Readex Pro: all Arabic, and the fallback that
      catches Arabic characters Outfit has no glyphs for. Bodoni Moda: the
      Didone of the logo wordmark, and the one editorial accent line a section
      is allowed. Inter: the Lumako wordmark in the footer and nothing else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400..500&family=Inter:wght@500;600&family=Outfit:wght@100..900&family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
