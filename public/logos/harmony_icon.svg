  <style>
    .mark { fill: #1a1a1a; }
    .accent { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #ffffff; }
      .accent { fill: #ffffff; }
    }
    text {
      font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
